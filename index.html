            }

  <script>
    (function () {
      try {
        var registry = __THEME_REGISTRY__;
        var KEY = 'swiftshare:theme:v2';
        var stored = null;

        try {
          var raw = localStorage.getItem(KEY);
          stored = raw ? JSON.parse(raw) : null;
        } catch (e) {}

        // One-time legacy migration if v2 key is absent
        if (!stored) {
          try {
            var rawTheme = localStorage.getItem('swiftshare_theme');
            var rawMode = localStorage.getItem('swiftshare_theme_mode');
            var rawSettings = localStorage.getItem('swiftshare_settings');
            if (rawTheme || rawMode || rawSettings) {
              var parsedTheme = null;
              try { parsedTheme = rawTheme ? JSON.parse(rawTheme) : null; } catch (e) { parsedTheme = rawTheme; }
              var parsedSettings = null;
              try { parsedSettings = rawSettings ? JSON.parse(rawSettings) : null; } catch (e) {}

              var hasManual = Boolean(parsedTheme && registry.themes.some(function(t) { return t.id === parsedTheme; }));
              var isRandom = (parsedSettings && typeof parsedSettings.randomTheme === 'boolean')
                ? parsedSettings.randomTheme
                : !hasManual;
              var targetTheme = hasManual ? parsedTheme : (rawMode === 'light' ? 'sunrise' : 'sunset');
              var matched = registry.themes.find(function(t) { return t.id === targetTheme; }) || registry.themes[0];

              stored = {
                v: 2,
                mode: matched.mode,
                random: isRandom,
                theme: matched.id,
                last: {}
              };
              stored.last[matched.mode] = matched.id;

              localStorage.removeItem('swiftshare_theme');
              localStorage.removeItem('swiftshare_theme_mode');
            }
          } catch (e) {}
        }

        var defaultMode = registry.default.mode || 'dark';
        var defaultRandom = registry.default.random !== false;

        if (!stored || typeof stored !== 'object') {
          var defTheme = defaultMode === 'light' ? 'sunrise' : 'sunset';
          stored = {
            v: 2,
            mode: defaultMode,
            random: defaultRandom,
            theme: defTheme,
            last: {}
          };
          stored.last[defaultMode] = defTheme;
        }

        var themeObj = registry.themes.find(function(t) { return t.id === stored.theme; });
        if (!themeObj) {
          var fbId = stored.mode === 'light' ? 'sunrise' : 'sunset';
          themeObj = registry.themes.find(function(t) { return t.id === fbId; }) || registry.themes[0];
        }
        stored.mode = themeObj.mode;
        stored.theme = themeObj.id;
        if (typeof stored.random !== 'boolean') stored.random = defaultRandom;
        if (!stored.last) stored.last = {};
        stored.last[stored.mode] = stored.theme;

        if (stored.random) {
          var pool = registry.themes.filter(function(t) { return t.mode === stored.mode; });
          var lastId = stored.last[stored.mode];
          var candidates = pool.length > 1 ? pool.filter(function(t) { return t.id !== lastId; }) : pool;
          if (candidates.length === 0) candidates = pool;
          var picked = candidates[Math.floor(Math.random() * candidates.length)];
          stored.theme = picked.id;
          stored.mode = picked.mode;
          stored.last[picked.mode] = picked.id;
          themeObj = picked;
        }

        try {
          localStorage.setItem(KEY, JSON.stringify(stored));
        } catch (e) {}

        var html = document.documentElement;
        html.setAttribute('data-theme', themeObj.id);
        html.setAttribute('data-mode', themeObj.mode);
        html.style.colorScheme = themeObj.mode;
        html.style.backgroundColor = themeObj.boot.bg;
        html.style.color = themeObj.boot.text;

        var metaTheme = document.querySelector('meta[name="theme-color"]');
        if (metaTheme) {
          metaTheme.setAttribute('content', themeObj.boot.themeColor);
        }

        html.classList.add('no-theme-transition');
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            html.classList.remove('no-theme-transition');
          });
        });

        window.__SS_THEME__ = {
          theme: themeObj.id,
          mode: themeObj.mode,
          random: stored.random,
          prefs: stored
        };
      } catch (err) {
        document.documentElement.setAttribute('data-theme', 'sunset');
        document.documentElement.setAttribute('data-mode', 'dark');
        document.documentElement.style.colorScheme = 'dark';
        document.documentElement.style.backgroundColor = '#0C0502';
        document.documentElement.style.color = '#FDF3E8';
      }
    })();
  </script>
  <style>
    /* CRITICAL: Prevent white flashes and theme transition flickering during boot */
    html.no-theme-transition * {
      transition: none !important;
    }
    html[data-mode="dark"] {
      color-scheme: dark;
    }
    html[data-mode="light"] {
      color-scheme: light;
    }
    html,
    body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      min-height: 100%;
    }

    body {
      background-color: inherit;
      color: inherit;
    }

    /* Clean initial loading spinner before React mounts */
    #root {
      min-height: 100vh;
      min-height: 100dvh;
    }

    .initial-loading-container {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: inherit;
      color: inherit;
      z-index: 9999;
      pointer-events: none;
    }

    .initial-loading-card {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: var(--bg-sunken, var(--initial-surface));
      border: 1px solid var(--border, rgba(255, 255, 255, 0.1));
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      overflow: hidden;
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    .initial-loading-glow {
      position: absolute;
      inset: -50%;
      border-radius: 50%;
      background: var(--accent, var(--initial-accent));
      opacity: 0.18;
      filter: blur(14px);
      animation: ss-initial-pulse 2.4s ease-in-out infinite;
      transition: background 0.3s ease;
    }

    .initial-spinner {
      width: 28px;
      height: 28px;
      position: relative;
      z-index: 1;
      color: var(--accent, var(--initial-accent));
      animation: ss-initial-spin 0.8s linear infinite;
      will-change: transform;
      transition: color 0.3s ease;
    }

    .initial-spinner svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    @keyframes ss-initial-spin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes ss-initial-pulse {
      0%, 100% {
        transform: scale(0.9);
        opacity: 0.12;
      }
      50% {
        transform: scale(1.15);
        opacity: 0.25;
      }
    }

    body.reduce-motion .initial-spinner {
      animation: none;
    }
    body.reduce-motion .initial-loading-glow {
      animation: none;
      opacity: 0.15;
    }
  </style>

  <script>
    // Load and apply reduced motion preference before any elements or scripts render
    (function () {
      try {
        var settingsRaw = localStorage.getItem('swiftshare_settings');
        var settings = settingsRaw ? JSON.parse(settingsRaw) : null;
        var reducedMotion = false;
        if (settings && typeof settings.reducedMotion === 'boolean') {
          reducedMotion = settings.reducedMotion;
        } else {
          reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        }
        if (reducedMotion) {
          document.body.classList.add('reduce-motion');
        }
      } catch (e) { }
    })();
  </script>

    <div style="padding: 32px; max-width: 800px; margin: 0 auto; font-family: 'DM Sans', sans-serif; color: #FAFAFA; background: #09090B;">
      <h1>SwiftShare - Free Online Clipboard &amp; Instant File Transfer</h1>
      <p>SwiftShare is a free, no-signup online clipboard and browser-based ephemeral file sharing tool. Sync text, copy-paste across Android, iOS, Windows, macOS, and Linux, and transfer files using 6-digit transfer codes, camera QR codes, password protection, and burn-after-download privacy.</p>
      <h2>How It Works in 3 Steps</h2>
      <ol>
        <li><strong>Drop or Paste:</strong> Drop files up to 100 MB or paste text into the online clipboard.</li>
        <li><strong>Share 6-Digit Code:</strong> Share the generated 6-digit code or display the QR code.</li>
        <li><strong>Grab &amp; Auto-Delete:</strong> The receiver downloads the file and data self-destructs upon expiry or in Burn mode.</li>
      </ol>
      <h2>Frequently Asked Questions</h2>
      <details>
        <summary><strong>How does the online clipboard work between phone and PC?</strong></summary>
        <p>Click "Share Text", paste your note, command, or link, and click Share. You will get a 6-digit code or QR code. On your other device, visit SwiftShare, type the 6 digits or scan the QR, and click "Copy to Clipboard".</p>
      </details>
      <details>
        <summary><strong>Do I or the receiver need an account?</strong></summary>
        <p>No. SwiftShare never asks for an account, email, or phone number. Anyone can send or receive immediately without registration.</p>
      </details>
      <details>
        <summary><strong>How long do transfers stay available?</strong></summary>
        <p>By default, files and snippets expire in 60 minutes, but you can select 10 minutes, 1 hour, or up to 24 hours. Once expired, files are permanently deleted.</p>
      </details>
      <details>
        <summary><strong>What is Burn after download mode?</strong></summary>
        <p>When Burn mode is enabled, the transfer is permanently deleted from storage as soon as the recipient finishes downloading it.</p>
      </details>
      <details>
        <summary><strong>What are the transfer file size limits?</strong></summary>
        <p>You can transfer up to 10 files at a time with a total combined size of up to 100 MB per transfer session, completely free.</p>
      </details>
