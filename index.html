<head>
  <meta charset="UTF-8" />

  <meta name="theme-color" content="#09090B" />
  <meta name="color-scheme" content="dark light" />
  <title>SwiftShare — Send Files Without Sign-Up (Free, Self-Destructing Links)</title>
  <meta name="description" content="Send files or text to any device with a 6-character code or QR scan. No account needed. Links expire automatically, with optional password and burn-after-download." />
  <link rel="canonical" href="%VITE_SITE_URL%/" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="SwiftShare" />
  <meta property="og:title" content="SwiftShare — Send Files Without Sign-Up" />
  <meta property="og:description" content="Share files with a code or QR. No account. Auto-expiring links, optional password, burn-after-download." />
  <meta property="og:url" content="%VITE_SITE_URL%/" />
  <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="SwiftShare — Send Files Without Sign-Up" />
  <meta name="twitter:description" content="Share files with a code or QR. No account. Auto-expiring links." />
  <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />

  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="application-name" content="SwiftShare" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "@id": "%VITE_SITE_URL%/#website",
        "url": "%VITE_SITE_URL%/",
        "name": "SwiftShare",
        "alternateName": ["Swift Share"]
      },
      {
        "@type": "WebApplication",
        "@id": "%VITE_SITE_URL%/#app",
        "name": "SwiftShare",
        "url": "%VITE_SITE_URL%/",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any (web browser)",
        "description": "Send files or text to any device with a short code or QR scan. No account required.",
        "offers": {
          "@type": "Offer",
          "price": 0,
          "priceCurrency": "USD"
        }
      }
    ]
  }
  </script>
  <script>
    (function () {
      try {
        var registry = __THEME_REGISTRY__;
        var KEY = 'swiftshare:theme:v2';
        var stored = null;

        try {
          var raw = localStorage.getItem(KEY);
          stored = raw ? JSON.parse(raw) : null;
        } catch (e) {}

        // One-time legacy migration if v2 key is absent
        if (!stored) {
          try {
            var rawTheme = localStorage.getItem('swiftshare_theme');
            var rawMode = localStorage.getItem('swiftshare_theme_mode');
            var rawSettings = localStorage.getItem('swiftshare_settings');
            if (rawTheme || rawMode || rawSettings) {
              var parsedTheme = null;
              try { parsedTheme = rawTheme ? JSON.parse(rawTheme) : null; } catch (e) { parsedTheme = rawTheme; }
              var parsedSettings = null;
              try { parsedSettings = rawSettings ? JSON.parse(rawSettings) : null; } catch (e) {}

              var hasManual = Boolean(parsedTheme && registry.themes.some(function(t) { return t.id === parsedTheme; }));
              var isRandom = (parsedSettings && typeof parsedSettings.randomTheme === 'boolean')
                ? parsedSettings.randomTheme
                : !hasManual;
              var targetTheme = hasManual ? parsedTheme : (rawMode === 'light' ? 'sunrise' : 'sunset');
              var matched = registry.themes.find(function(t) { return t.id === targetTheme; }) || registry.themes[0];

              stored = {
                v: 2,
                mode: matched.mode,
                random: isRandom,
                theme: matched.id,
                last: {}
              };
              stored.last[matched.mode] = matched.id;

              localStorage.removeItem('swiftshare_theme');
              localStorage.removeItem('swiftshare_theme_mode');
            }
          } catch (e) {}
        }

        var defaultMode = registry.default.mode || 'dark';
        var defaultRandom = registry.default.random !== false;

        if (!stored || typeof stored !== 'object') {
          var defTheme = defaultMode === 'light' ? 'sunrise' : 'sunset';
          stored = {
            v: 2,
            mode: defaultMode,
            random: defaultRandom,
            theme: defTheme,
            last: {}
          };
          stored.last[defaultMode] = defTheme;
        }

        var themeObj = registry.themes.find(function(t) { return t.id === stored.theme; });
        if (!themeObj) {
          var fbId = stored.mode === 'light' ? 'sunrise' : 'sunset';
          themeObj = registry.themes.find(function(t) { return t.id === fbId; }) || registry.themes[0];
        }
        stored.mode = themeObj.mode;
        stored.theme = themeObj.id;
        if (typeof stored.random !== 'boolean') stored.random = defaultRandom;
        if (!stored.last) stored.last = {};
        stored.last[stored.mode] = stored.theme;

        if (stored.random) {
          var pool = registry.themes.filter(function(t) { return t.mode === stored.mode; });
          var lastId = stored.last[stored.mode];
          var candidates = pool.length > 1 ? pool.filter(function(t) { return t.id !== lastId; }) : pool;
          if (candidates.length === 0) candidates = pool;
          var picked = candidates[Math.floor(Math.random() * candidates.length)];
          stored.theme = picked.id;
          stored.mode = picked.mode;
          stored.last[picked.mode] = picked.id;
          themeObj = picked;
        }

        try {
          localStorage.setItem(KEY, JSON.stringify(stored));
        } catch (e) {}

        var html = document.documentElement;
        html.setAttribute('data-theme', themeObj.id);
        html.setAttribute('data-mode', themeObj.mode);
        html.style.colorScheme = themeObj.mode;
        html.style.backgroundColor = themeObj.boot.bg;
        html.style.color = themeObj.boot.text;

        var metaTheme = document.querySelector('meta[name="theme-color"]');
        if (metaTheme) {
          metaTheme.setAttribute('content', themeObj.boot.themeColor);
        }

        html.classList.add('no-theme-transition');
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            html.classList.remove('no-theme-transition');
          });
        });

        window.__SS_THEME__ = {
          theme: themeObj.id,
          mode: themeObj.mode,
          random: stored.random,
          prefs: stored
        };
      } catch (err) {
        document.documentElement.setAttribute('data-theme', 'sunset');
        document.documentElement.setAttribute('data-mode', 'dark');
        document.documentElement.style.colorScheme = 'dark';
        document.documentElement.style.backgroundColor = '#0C0502';
        document.documentElement.style.color = '#FDF3E8';
      }
    })();
  </script>
  <style>
    /* CRITICAL: Prevent white flashes and theme transition flickering during boot */
    html.no-theme-transition * {
      transition: none !important;
    }
    html[data-mode="dark"] {
      color-scheme: dark;
    }
    html[data-mode="light"] {
      color-scheme: light;
    }
    html,
    body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      min-height: 100%;
    }

    body {
      background-color: inherit;
      color: inherit;
    }

    /* Clean initial loading spinner before React mounts */
    #root {
      min-height: 100vh;
      min-height: 100dvh;
    }

    .initial-loading-container {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: inherit;
      color: inherit;
      z-index: 9999;
      pointer-events: none;
    }

    .initial-loading-card {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: var(--bg-sunken, var(--initial-surface));
      border: 1px solid var(--border, rgba(255, 255, 255, 0.1));
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      overflow: hidden;
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    .initial-loading-glow {
      position: absolute;
      inset: -50%;
      border-radius: 50%;
      background: var(--accent, var(--initial-accent));
      opacity: 0.18;
      filter: blur(14px);
      animation: ss-initial-pulse 2.4s ease-in-out infinite;
      transition: background 0.3s ease;
    }

    .initial-spinner {
      width: 28px;
      height: 28px;
      position: relative;
      z-index: 1;
      color: var(--accent, var(--initial-accent));
      animation: ss-initial-spin 0.8s linear infinite;
      will-change: transform;
      transition: color 0.3s ease;
    }

    .initial-spinner svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    @keyframes ss-initial-spin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes ss-initial-pulse {
      0%, 100% {
        transform: scale(0.9);
        opacity: 0.12;
      }
      50% {
        transform: scale(1.15);
        opacity: 0.25;
      }
    }

    body.reduce-motion .initial-spinner {
      animation: none;
    }
    body.reduce-motion .initial-loading-glow {
      animation: none;
      opacity: 0.15;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" />
</head>

<body>
  <script>
    // Load and apply reduced motion preference before any elements or scripts render
    (function () {
      try {
        var settingsRaw = localStorage.getItem('swiftshare_settings');
        var settings = settingsRaw ? JSON.parse(settingsRaw) : null;
        var reducedMotion = false;
        if (settings && typeof settings.reducedMotion === 'boolean') {
          reducedMotion = settings.reducedMotion;
        } else {
          reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        }
        if (reducedMotion) {
          document.body.classList.add('reduce-motion');
        }
      } catch (e) { }
    })();
  </script>
  <div id="root">
    <div class="initial-loading-container" aria-label="Loading SwiftShare" role="status">
      <div class="initial-loading-card">
        <div class="initial-loading-glow"></div>
        <div class="initial-spinner">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="10" stroke-opacity="0.2" stroke-width="3" stroke-linecap="round" />
            <path d="M12 2C6.47715 2 2 6.47715 2 12" stroke-width="3" stroke-linecap="round" />
          </svg>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
